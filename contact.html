<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="联系我 — 平面设计师" />
  <title>联系 — 吴永聪</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">吴永聪<span class="brand__dot"></span></a>
      <button class="nav-toggle" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav">
        <a href="index.html">首页</a>
        <a href="works.html">作品</a>
        <a href="about.html">关于</a>
        <a href="contact.html">联系</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section container">
      <div class="section__head">
        <h1 class="section__title">联系</h1>
      </div>

      <div class="contact-grid">
        <div class="contact-info fade-in">
          <h2>期待与你合作</h2>
          <p>
            如果你有品牌、编辑、包装或数字设计方面的需求，
            欢迎随时与我联系，我们可以一起聊聊你的想法。
          </p>
          <div class="contact-links">
            <a href="mailto:15767404507@139.com">15767404507@139.com</a>
            <a href="https://focalab.com" target="_blank" rel="noopener">focalab.com ↗</a>
            <a href="#" target="_blank" rel="noopener">Behance ↗</a>
            <a href="#" target="_blank" rel="noopener">Instagram ↗</a>
          </div>
        </div>

        <form class="contact-form fade-in" action="#" method="post">
          <div class="form-field">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" placeholder="吴永聪" required />
          </div>
          <div class="form-field">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="form-field">
            <label for="message">留言</label>
            <textarea id="message" name="message" rows="5" placeholder="简单介绍一下你的项目…"></textarea>
          </div>
          <button class="btn btn--solid" type="submit">发送</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© <span data-year>2024</span> 吴永聪</span>
      <div class="site-footer__social">
        <a href="https://focalab.com" target="_blank" rel="noopener" aria-label="个人网站">focalab.com</a>
        <a href="#" aria-label="Behance">Behance</a>
        <a href="#" aria-label="Instagram">Instagram</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
